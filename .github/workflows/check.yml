name: Check public newspaper
on:
  push:
    branches: [main]
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -v
      - run: python scripts/check_newspaper.py
      - run: python scripts/rebuild_frontpage.py
      - run: git diff --exit-code -- docs/index.html
