<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1536 1024" width="1536" height="1024">
  <!-- C13 home art: one model working across five kinds of deep work (code, finance, legal, cyber, science).
       Hand-drawn style SVG made by the editors; no text, no product screens. -->
  <defs>
    <pattern id="grain" width="6" height="6" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r=".6" fill="#e9e3d6"/>
    </pattern>
    <style>
      .ink{fill:none;stroke:#1b1b1d;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}
      .thin{fill:none;stroke:#1b1b1d;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
      .hair{fill:none;stroke:#6b6862;stroke-width:2;stroke-linecap:round;stroke-dasharray:2 9}
      .paper{fill:#fffdf7;stroke:#1b1b1d;stroke-width:4;stroke-linejoin:round}
      .shade{fill:#ece6d8}
      .red{fill:#821c32}
      .redline{fill:none;stroke:#821c32;stroke-width:5;stroke-linecap:round;stroke-linejoin:round}
    </style>
  </defs>
  <rect width="1536" height="1024" fill="#faf7f0"/>
  <rect width="1536" height="1024" fill="url(#grain)"/>

  <!-- dotted work lines from the centre to each desk item -->
  <path class="hair" d="M768 470 C 600 380 470 300 360 250"/>
  <path class="hair" d="M768 470 C 960 380 1080 300 1190 250"/>
  <path class="hair" d="M768 560 C 560 640 430 700 330 760"/>
  <path class="hair" d="M768 560 C 980 640 1110 700 1210 760"/>
  <path class="hair" d="M768 600 L 768 860"/>

  <!-- centre: a tall stack of long documents = long-context deep work -->
  <g transform="translate(618 300)">
    <rect class="shade" x="22" y="26" width="300" height="360" rx="6"/>
    <rect class="paper" x="14" y="16" width="300" height="360" rx="6"/>
    <rect class="paper" x="6" y="8" width="300" height="360" rx="6"/>
    <rect class="paper" x="0" y="0" width="300" height="360" rx="6"/>
    <path class="thin" d="M40 56 H250 M40 92 H260 M40 128 H230 M40 164 H262 M40 200 H214 M40 236 H250 M40 272 H190"/>
    <path class="redline" d="M36 300 Q 150 286 264 304"/>
    <circle class="red" cx="262" cy="56" r="11"/>
  </g>

  <!-- top-left: code window -->
  <g transform="translate(150 120) rotate(-6)">
    <rect class="shade" x="10" y="12" width="300" height="200" rx="14"/>
    <rect class="paper" x="0" y="0" width="300" height="200" rx="14"/>
    <path class="thin" d="M0 44 H300"/>
    <circle class="red" cx="30" cy="22" r="7"/><circle cx="54" cy="22" r="7" fill="#1b1b1d"/><circle cx="78" cy="22" r="7" fill="#b9b2a4"/>
    <path class="ink" d="M64 92 L36 120 L64 148 M236 92 L264 120 L236 148 M168 80 L132 160"/>
  </g>

  <!-- top-right: finance chart -->
  <g transform="translate(1060 110) rotate(5)">
    <rect class="shade" x="10" y="12" width="300" height="220" rx="8"/>
    <rect class="paper" x="0" y="0" width="300" height="220" rx="8"/>
    <path class="thin" d="M36 186 H270 M36 186 V40"/>
    <rect x="62" y="132" width="30" height="54" fill="#cfc7b6" stroke="#1b1b1d" stroke-width="2.5"/>
    <rect x="112" y="108" width="30" height="78" fill="#cfc7b6" stroke="#1b1b1d" stroke-width="2.5"/>
    <rect x="162" y="86" width="30" height="100" fill="#cfc7b6" stroke="#1b1b1d" stroke-width="2.5"/>
    <rect x="212" y="58" width="30" height="128" fill="#821c32" stroke="#1b1b1d" stroke-width="2.5"/>
    <path class="redline" d="M62 120 L127 96 L177 74 L240 40"/>
  </g>

  <!-- bottom-left: legal contract with seal -->
  <g transform="translate(170 640) rotate(4)">
    <rect class="shade" x="10" y="12" width="260" height="300" rx="6"/>
    <rect class="paper" x="0" y="0" width="260" height="300" rx="6"/>
    <path class="thin" d="M36 50 H220 M36 84 H224 M36 118 H200 M36 152 H226 M36 186 H170"/>
    <circle cx="190" cy="240" r="34" fill="none" stroke="#821c32" stroke-width="5"/>
    <circle cx="190" cy="240" r="20" fill="none" stroke="#821c32" stroke-width="3"/>
    <path class="ink" d="M40 252 C 70 226 92 270 120 244"/>
  </g>

  <!-- bottom-right: cyber defence shield with lock -->
  <g transform="translate(1080 640) rotate(-5)">
    <path class="shade" d="M150 12 L270 56 V150 C270 236 214 290 150 316 C86 290 30 236 30 150 V56 Z" transform="translate(10 10)"/>
    <path class="paper" d="M150 12 L270 56 V150 C270 236 214 290 150 316 C86 290 30 236 30 150 V56 Z"/>
    <rect x="112" y="150" width="76" height="70" rx="8" fill="#821c32" stroke="#1b1b1d" stroke-width="4"/>
    <path class="ink" d="M126 150 V124 C126 92 174 92 174 124 V150"/>
    <circle cx="150" cy="184" r="8" fill="#fffdf7"/>
  </g>

  <!-- bottom-centre: science, molecule on a lab notebook -->
  <g transform="translate(648 800)">
    <rect class="shade" x="10" y="10" width="240" height="170" rx="8"/>
    <rect class="paper" x="0" y="0" width="240" height="170" rx="8"/>
    <g class="ink">
      <path d="M70 60 L110 38 L150 60 L150 104 L110 126 L70 104 Z"/>
      <path d="M150 60 L192 40 M70 104 L34 126 M110 126 V152"/>
    </g>
    <circle class="red" cx="192" cy="40" r="11"/>
    <circle cx="34" cy="126" r="10" fill="#1b1b1d"/>
    <circle cx="110" cy="152" r="9" fill="#b9b2a4" stroke="#1b1b1d" stroke-width="2.5"/>
  </g>

  <!-- pencil and coffee as desk context -->
  <g transform="translate(470 520) rotate(-28)">
    <rect x="0" y="0" width="150" height="18" rx="4" fill="#fffdf7" stroke="#1b1b1d" stroke-width="3"/>
    <path d="M150 0 L176 9 L150 18 Z" fill="#1b1b1d"/>
    <rect x="-16" y="0" width="16" height="18" fill="#821c32" stroke="#1b1b1d" stroke-width="3"/>
  </g>
  <g transform="translate(1000 470)">
    <ellipse cx="60" cy="96" rx="78" ry="16" class="shade"/>
    <path class="paper" d="M10 20 H110 V80 C110 104 10 104 10 80 Z"/>
    <ellipse cx="60" cy="20" rx="50" ry="12" fill="#3a2a22" stroke="#1b1b1d" stroke-width="4"/>
    <path class="ink" d="M110 34 C 146 34 146 74 110 74"/>
  </g>
</svg>
